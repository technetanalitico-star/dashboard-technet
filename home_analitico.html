<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECNET — Painel de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active {
            color: #ef4444;
            font-weight: 800;
        }
        .pill-active {
            background-color: #ef4444;
            color: #ffffff;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen antialiased">

    <!-- TELA DE LOGIN (EXIBIDA INICIALMENTE) -->
    <div id="viewLogin" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
        <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-900">TECNET</h2>
                <p class="text-xs font-semibold text-slate-400">Insira suas credenciais para acessar suas vendas</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-black uppercase tracking-wider text-slate-500 mb-1">Usuário / Nome</label>
                    <div class="relative">
                        <input type="text" id="inputUser" required placeholder="Ex: DAVI DE SOUZA" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-800 outline-none focus:border-red-500 focus:bg-white transition-all uppercase">
                        <i data-lucide="user" class="w-4 h-4 absolute right-3.5 top-3.5 text-slate-400"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-black uppercase tracking-wider text-slate-500 mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="inputPass" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-800 outline-none focus:border-red-500 focus:bg-white transition-all">
                        <i data-lucide="lock" class="w-4 h-4 absolute right-3.5 top-3.5 text-slate-400"></i>
                    </div>
                </div>

                <div id="loginError" class="hidden p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-xs font-bold text-center"></div>

                <button type="submit" id="btnLoginSubmit" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-red-500/30 text-xs tracking-wider uppercase transition-all flex items-center justify-center gap-2">
                    <span>Entrar no Painel</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO APP (OCULTO ATÉ O LOGIN) -->
    <div id="appContent" class="hidden pb-24">

        <!-- HEADER TOP BAR -->
        <header class="bg-white px-4 pt-4 pb-3 sticky top-0 z-40 border-b border-slate-100 shadow-sm">
            <div class="flex justify-between items-center max-w-md mx-auto">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-red-50 text-red-600 rounded-xl">
                        <i data-lucide="user-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-black tracking-tight leading-none text-slate-900" id="headerUserName">Usuário</h1>
                        <p class="text-[10px] font-bold text-slate-400 mt-0.5 uppercase tracking-wider" id="headerUserRole">VENDEDOR</p>
                    </div>
                </div>
                <button onclick="logout()" class="p-2 bg-slate-100 rounded-xl text-slate-600 hover:text-red-600 transition-colors" title="Sair">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- FILTRO DE EMPRESA (VNA / RDT / TODOS) -->
            <div class="flex items-center gap-2 overflow-x-auto mt-3 pb-1 no-scrollbar max-w-md mx-auto">
                <button onclick="filterBranch('TODOS')" class="pill-btn pill-active text-xs font-bold px-4 py-1.5 rounded-full whitespace-nowrap transition-all">TODOS</button>
                <button onclick="filterBranch('VNA')" class="pill-btn bg-slate-100 text-slate-600 text-xs font-bold px-4 py-1.5 rounded-full whitespace-nowrap transition-all">VNA</button>
                <button onclick="filterBranch('RDT')" class="pill-btn bg-slate-100 text-slate-600 text-xs font-bold px-4 py-1.5 rounded-full whitespace-nowrap transition-all">RDT</button>
            </div>
        </header>

        <main class="p-4 max-w-md mx-auto space-y-4">

            <!-- VIEW: DASHBOARD -->
            <div id="viewDashboard" class="space-y-4">
                
                <!-- TOTAL DE PRODUTOS VENDIDOS -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 uppercase">Virtua / Banda</p>
                            <h3 id="valVirtua" class="text-2xl font-black text-slate-800 mt-0.5">0</h3>
                        </div>
                        <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="wifi" class="w-5 h-5"></i></div>
                    </div>

                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 uppercase">Móvel / Chip</p>
                            <h3 id="valMovel" class="text-2xl font-black text-slate-800 mt-0.5">0</h3>
                        </div>
                        <div class="p-2.5 bg-purple-50 text-purple-600 rounded-xl"><i data-lucide="smartphone" class="w-5 h-5"></i></div>
                    </div>

                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 uppercase">TV</p>
                            <h3 id="valTV" class="text-2xl font-black text-slate-800 mt-0.5">0</h3>
                        </div>
                        <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="tv" class="w-5 h-5"></i></div>
                    </div>

                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 uppercase">Fone Fixo</p>
                            <h3 id="valFone" class="text-2xl font-black text-slate-800 mt-0.5">0</h3>
                        </div>
                        <div class="p-2.5 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="phone" class="w-5 h-5"></i></div>
                    </div>
                </div>

                <!-- METRICAS DE CONTRATOS -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-3.5 rounded-2xl border-l-4 border-emerald-500 shadow-sm">
                        <p class="text-[10px] font-extrabold uppercase text-slate-400">Minhas Vendas</p>
                        <h3 id="valTotalContratos" class="text-2xl font-black text-slate-800">0</h3>
                        <p class="text-[9px] font-semibold text-slate-400 mt-1">Registradas</p>
                    </div>

                    <div class="bg-white p-3.5 rounded-2xl border-l-4 border-blue-500 shadow-sm">
                        <p class="text-[10px] font-extrabold uppercase text-slate-400">Via Solar</p>
                        <h3 id="valSolarCount" class="text-2xl font-black text-slate-800">0</h3>
                        <p class="text-[9px] font-semibold text-slate-400 mt-1">Geradas pelo Solar</p>
                    </div>
                </div>

                <!-- RECEITA INDIVIDUAL/GERAL -->
                <div class="bg-slate-900 p-5 rounded-2xl text-white space-y-3 relative overflow-hidden shadow-lg">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Receita Produzida</p>
                            <h2 id="valReceita" class="text-3xl font-black mt-0.5">R$ 0,00</h2>
                        </div>
                        <span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-500/30">Acumulado</span>
                    </div>
                </div>

                <!-- RANKING OU DESEMPENHO -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-black uppercase text-slate-800 flex items-center gap-2">
                            <i data-lucide="award" class="w-4 h-4 text-amber-500"></i> Desempenho
                        </h3>
                        <span class="text-[10px] font-bold text-slate-400 uppercase" id="lblRankingTitle">Por Volume</span>
                    </div>
                    <div id="topSellersContainer" class="space-y-3"></div>
                </div>

            </div>

            <!-- VIEW: VENDAS (LISTA) -->
            <div id="viewVendas" class="space-y-3 hidden">
                <div class="relative">
                    <input type="text" id="searchVendas" oninput="renderVendasList()" placeholder="Buscar cliente, CPF ou nº Solar..." class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold text-slate-800 outline-none focus:border-red-500">
                    <i data-lucide="search" class="w-4 h-4 absolute right-3 top-3 text-slate-400"></i>
                </div>

                <div id="vendasCardList" class="space-y-3"></div>
            </div>

        </main>

        <!-- BOTTOM NAVBAR MOBILE -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 z-50">
            <div class="max-w-md mx-auto flex justify-between items-center relative">
                <button onclick="switchTab('dashboard')" id="btnTabDashboard" class="tab-btn active flex flex-col items-center gap-1 text-slate-400">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    <span class="text-[10px]">Dashboard</span>
                </button>

                <button onclick="switchTab('vendas')" id="btnTabVendas" class="tab-btn flex flex-col items-center gap-1 text-slate-400">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span class="text-[10px]">Vendas</span>
                </button>

                <button class="w-12 h-12 bg-red-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-red-500/40 -mt-6 active:scale-95 transition-transform">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>

                <button onclick="logout()" class="tab-btn flex flex-col items-center gap-1 text-slate-400">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="text-[10px]">Sair</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        lucide.createIcons();

        // SUBSTUTUA AQUI PELA URL DO SEU GOOGLE APPS SCRIPT WEB APP IMPLANTADO
        const API_URL = 'https://script.google.com/macros/s/AKfycbzTFQSghz7va0BMPNj2HJ1mctEiZw8uqEssLTpvtQp4XBzueWKVmkYhFjxR9UvPozUGuQ/exec';

        let rawData = [];
        let currentUser = null;
        let currentBranch = 'TODOS';

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('inputUser').value.trim();
            const password = document.getElementById('inputPass').value.trim();
            const btnSubmit = document.getElementById('btnLoginSubmit');
            const errorDiv = document.getElementById('loginError');

            errorDiv.classList.add('hidden');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Autenticando...`;
            lucide.createIcons();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    currentUser = result.user;
                    rawData = result.sales.map(parseRow);
                    
                    document.getElementById('viewLogin').classList.add('hidden');
                    document.getElementById('appContent').classList.remove('hidden');
                    document.getElementById('headerUserName').textContent = currentUser.username;
                    document.getElementById('headerUserRole').textContent = currentUser.perfil;

                    renderAll();
                } else {
                    errorDiv.textContent = result.message || 'Erro ao realizar login.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Erro de conexão com o servidor. Verifique a API_URL.';
                errorDiv.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>Entrar no Painel</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                lucide.createIcons();
            }
        }

        function logout() {
            currentUser = null;
            rawData = [];
            document.getElementById('loginForm').reset();
            document.getElementById('appContent').classList.add('hidden');
            document.getElementById('viewLogin').classList.remove('hidden');
        }

        function parseRow(row) {
            let cleanRow = {};
            for (let k in row) {
                if (k) cleanRow[k.trim()] = row[k] ? String(row[k]).trim() : '';
            }

            let vendedor = '';
            for (let key in cleanRow) {
                if (key.startsWith('Qual é o vendedor?') && cleanRow[key]) {
                    vendedor = cleanRow[key];
                    break;
                }
            }

            let lider = '';
            for (let key in cleanRow) {
                if (key.startsWith('Qual é o líder?') && cleanRow[key]) {
                    lider = cleanRow[key];
                    break;
                }
            }

            const valorNum = parseFloat(
                (cleanRow['VALOR'] || '0')
                .replace('R$', '')
                .replace(/\./g, '')
                .replace(',', '.')
                .trim()
            ) || 0;

            return {
                timestamp: cleanRow['Timestamp'] || '',
                empresa: (cleanRow['Qual empresa?'] || 'GERAL').toUpperCase(),
                lider: lider || 'NÃO INFORMADO',
                vendedor: vendedor || 'NÃO INFORMADO',
                solar: cleanRow['GERADO PELO SOLAR?'] || '',
                numSolar: cleanRow['NÚMERO DO SOLAR'] || '-',
                cliente: cleanRow['NOME COMPLETO'] || 'CLIENTE NÃO INFORMADO',
                cpf: cleanRow['CPF/CNPJ'] || '',
                cidade: cleanRow['CIDADE'] || '',
                bairro: cleanRow['BAIRRO'] || '',
                tv: cleanRow['TV'] || '',
                virtua: cleanRow['VIRTUA'] || '',
                fone: cleanRow['FONE'] || '',
                chip: cleanRow['CHIP'] || '',
                valor: valorNum
            };
        }

        function switchTab(tab) {
            const dash = document.getElementById('viewDashboard');
            const vend = document.getElementById('viewVendas');
            const btnDash = document.getElementById('btnTabDashboard');
            const btnVend = document.getElementById('btnTabVendas');

            if (tab === 'dashboard') {
                dash.classList.remove('hidden');
                vend.classList.add('hidden');
                btnDash.classList.add('active');
                btnVend.classList.remove('active');
            } else {
                dash.classList.add('hidden');
                vend.classList.remove('hidden');
                btnDash.classList.remove('active');
                btnVend.classList.add('active');
            }
        }

        function filterBranch(branch) {
            currentBranch = branch;
            document.querySelectorAll('.pill-btn').forEach(btn => {
                if (btn.textContent.toUpperCase().includes(branch)) {
                    btn.classList.add('pill-active');
                    btn.classList.remove('bg-slate-100', 'text-slate-600');
                } else {
                    btn.classList.remove('pill-active');
                    btn.classList.add('bg-slate-100', 'text-slate-600');
                }
            });
            renderAll();
        }

        function getFilteredData() {
            return rawData.filter(i => {
                if (currentBranch === 'TODOS') return true;
                return i.empresa.includes(currentBranch);
            });
        }

        function renderAll() {
            const data = getFilteredData();

            let virtuaCount = 0, movelCount = 0, tvCount = 0, foneCount = 0;
            let totalReceita = 0, solarCount = 0;
            const sellerCounts = {};

            data.forEach(i => {
                if (i.virtua) virtuaCount++;
                if (i.chip) movelCount++;
                if (i.tv) tvCount++;
                if (i.fone) foneCount++;

                if (i.solar.toUpperCase() === 'SIM') solarCount++;
                totalReceita += i.valor;

                if (i.vendedor) {
                    sellerCounts[i.vendedor] = (sellerCounts[i.vendedor] || 0) + 1;
                }
            });

            document.getElementById('valVirtua').textContent = virtuaCount;
            document.getElementById('valMovel').textContent = movelCount;
            document.getElementById('valTV').textContent = tvCount;
            document.getElementById('valFone').textContent = foneCount;

            document.getElementById('valTotalContratos').textContent = data.length;
            document.getElementById('valSolarCount').textContent = solarCount;
            document.getElementById('valReceita').textContent = totalReceita.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const topSellersContainer = document.getElementById('topSellersContainer');
            topSellersContainer.innerHTML = '';

            const sortedSellers = Object.entries(sellerCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);

            if (sortedSellers.length === 0) {
                topSellersContainer.innerHTML = `<p class="text-xs text-slate-400 font-medium text-center py-2">Nenhum registro encontrado.</p>`;
            } else {
                sortedSellers.forEach(([name, count], index) => {
                    topSellersContainer.innerHTML += `
                        <div class="flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3 flex-1">
                                <span class="w-6 h-6 rounded-lg bg-slate-900 text-white font-black text-xs flex items-center justify-center">${index + 1}</span>
                                <div class="flex-1">
                                    <p class="text-xs font-black text-slate-800">${name}</p>
                                    <div class="w-full bg-slate-100 h-1.5 rounded-full mt-1">
                                        <div class="bg-red-500 h-1.5 rounded-full" style="width: ${Math.min(100, (count / (sortedSellers[0][1] || 1)) * 100)}%"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-black text-slate-900">${count}</span>
                                <p class="text-[8px] font-bold text-slate-400">VENDAS</p>
                            </div>
                        </div>
                    `;
                });
            }

            renderVendasList();
        }

        function renderVendasList() {
            const data = getFilteredData();
            const search = (document.getElementById('searchVendas').value || '').toLowerCase();
            const container = document.getElementById('vendasCardList');
            container.innerHTML = '';

            const filtered = data.filter(i => {
                const txt = `${i.cliente} ${i.vendedor} ${i.cpf} ${i.numSolar} ${i.cidade}`.toLowerCase();
                return txt.includes(search);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs font-bold text-slate-400">Nenhuma venda encontrada.</div>`;
                return;
            }

            filtered.forEach(i => {
                let prods = [];
                if (i.virtua) prods.push('VIRTUA');
                if (i.tv) prods.push('TV');
                if (i.chip) prods.push('MÓVEL');
                if (i.fone) prods.push('FONE');
                const tagProd = prods.join(' + ') || 'VENDA';

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2.5">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <h4 class="font-black text-sm text-slate-900 leading-tight">${i.cliente}</h4>
                                <p class="text-[10px] font-bold text-slate-400 mt-0.5">
                                    SOLAR: <span class="text-slate-700 font-black">${i.numSolar}</span> 
                                    ${i.cpf ? `• CPF: <span class="text-slate-700">${i.cpf}</span>` : ''}
                                </p>
                            </div>
                            <span class="bg-red-50 text-red-600 text-[9px] font-black px-2 py-1 rounded-lg shrink-0">${tagProd}</span>
                        </div>

                        <div class="flex items-center justify-between text-[11px] font-semibold bg-slate-50 p-2 rounded-xl text-slate-600">
                            <div class="flex items-center gap-1">
                                <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                                <span>Vend: <strong class="text-slate-800">${i.vendedor}</strong></span>
                            </div>
                            <span class="font-black text-slate-900">${i.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                        </div>

                        <div class="flex justify-between items-center text-[10px] text-slate-400 pt-0.5">
                            <span class="flex items-center gap-1">
                                <i data-lucide="map-pin" class="w-3 h-3"></i> ${i.cidade || 'CIDADE N/I'} ${i.bairro ? `(${i.bairro})` : ''}
                            </span>
                            <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-bold uppercase">${i.empresa}</span>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }
    </script>
</body>
</html>
